<style>
  :root{
    --accent: #a78bfa;
    --accent-soft: rgba(167,139,250,0.14);
    --bg: #0b0d11;
    --panel: #14171d;
    --panel-border: #262a33;
    --text: #e8e9ec;
    --muted: #8b909c;
    --danger: #f87171;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:28px 20px 60px;
    max-width:960px;
    margin:0 auto;
    -webkit-font-smoothing:antialiased;
  }
  .header{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
  .header .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
  h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-0.01em;}
  p.sub{color:var(--muted);font-size:13px;margin:6px 0 26px;line-height:1.5;}
  h2{font-size:14px;margin-top:34px;margin-bottom:12px;color:#c4c8d0;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;}

  .authRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--panel-border);padding:14px 16px;border-radius:12px;}
  input[type=password]{
    background:#1a1e26;border:1px solid var(--panel-border);color:var(--text);
    padding:9px 12px;border-radius:8px;font-size:14px;width:200px;
    transition:border-color .15s;
  }
  input[type=password]:focus{outline:none;border-color:var(--accent);}
  .remember{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none;}
  .remember input{accent-color:var(--accent);cursor:pointer;}
  button{
    background:var(--accent);color:#08090b;border:none;padding:9px 16px;border-radius:8px;
    font-weight:700;cursor:pointer;font-size:14px;transition:filter .15s,transform .1s;
  }
  button:hover{filter:brightness(1.08);}
  button:active{transform:scale(0.98);}
  #err{color:var(--danger);font-size:13px;margin-top:10px;min-height:1px;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;}
  .card{
    background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;
    padding:18px 18px 16px;transition:border-color .15s,transform .15s;
  }
  .card:hover{border-color:#3a3f4a;transform:translateY(-1px);}
  .card .label{font-size:12.5px;color:var(--muted);margin-bottom:8px;font-weight:500;}
  .card .value{font-size:30px;font-weight:800;color:var(--accent);line-height:1;letter-spacing:-0.02em;}
  .breakdown{margin-top:12px;padding-top:12px;border-top:1px solid var(--panel-border);font-size:12.5px;color:#c4c8d0;}
  .breakdown div{display:flex;justify-content:space-between;padding:3px 0;}
  .breakdown span:last-child{color:var(--accent);font-weight:600;}

  .tablewrap{overflow-x:auto;border:1px solid var(--panel-border);border-radius:12px;background:var(--panel);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--panel-border);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:0.03em;background:#181b21;}
  td{color:#dcdfe4;}
  tbody tr:hover td{background:#181b21;}
  .pill{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:3px 9px;font-size:11px;font-weight:600;}
  .empty{color:var(--muted);font-size:13px;padding:20px;text-align:center;}
  .footer{margin-top:40px;color:#565a63;font-size:11.5px;text-align:center;}

  @media (max-width:600px){
    body{padding:20px 14px 40px;}
    input[type=password]{width:100%;}
    .authRow{flex-direction:column;align-items:stretch;}
  }
</style>
</head>
<body>
  <div class="header"><span class="dot"></span><h1>QA Forge Analytics</h1></div>
  <p class="sub">Try it live, test case creation, feedback, and About views — with city/region/browser/OS per event.</p>

  <div class="authRow">
    <input id="keyInput" type="password" placeholder="Enter your STATS_SECRET">
    <label class="remember"><input type="checkbox" id="rememberChk"> Remember this device</label>
    <button onclick="load()">View</button>
  </div>
  <div id="err"></div>
  <div id="results" style="margin-top:26px;"></div>

<script>
const STORAGE_KEY = 'qaforge_stats_key';
const EVENT_LABELS = {"try-it-live": "Try it live clicks", "create-testcase": "Test cases generated (runs)", "send-feedback": "Feedback submitted", "about-qaforge": "About QA Forge views"};

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// Consistent 12-hour formatting regardless of the viewer's device/locale
// settings (previously used toLocaleString() with no options, which
// rendered 24-hour time on some devices and 12-hour on others).
function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:true });
}

window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    document.getElementById('keyInput').value = saved;
    document.getElementById('rememberChk').checked = true;
    load();
  }
});

async function load(){
  const key = document.getElementById('keyInput').value.trim();
  const remember = document.getElementById('rememberChk').checked;
  const err = document.getElementById('err');
  const results = document.getElementById('results');
  err.textContent = '';
  results.innerHTML = '<div class="empty">Loading…</div>';

  try{
    const resp = await fetch('/.netlify/functions/get-stats?key=' + encodeURIComponent(key));
    if (!resp.ok) {
      err.textContent = resp.status === 401 ? 'Wrong key.' : 'Error loading stats.';
      results.innerHTML = '';
      return; // never save an unverified key
    }
    // Only persist the key once it's confirmed correct
    if (remember) localStorage.setItem(STORAGE_KEY, key);
    else localStorage.removeItem(STORAGE_KEY);

    const data = await resp.json();
    render(data.stats || {}, data.recentEvents || []);
  } catch(e){
    err.textContent = 'Could not reach the stats function.';
    results.innerHTML = '';
  }
}

function render(stats, events){
  const results = document.getElementById('results');
  const topLevelKeys = Object.keys(stats).filter(k => !k.includes(':'));

  let html = `<div class="cards">`;
  if (!topLevelKeys.length) {
    html += `<div class="empty" style="grid-column:1/-1;">No events recorded yet.</div>`;
  }
  for (const key of topLevelKeys) {
    const label = EVENT_LABELS[key] || key;
    const count = stats[key];
    const breakdownKeys = Object.keys(stats).filter(k => k.startsWith(key + ':'));
    const breakdownHtml = breakdownKeys.length ? `<div class="breakdown">${
      breakdownKeys.map(k => {
        const parts = k.split(':');
        const value = parts.slice(2).join(':');
        return `<div><span>${esc(value)}</span><span>${esc(stats[k])}</span></div>`;
      }).join('')
    }</div>` : '';
    html += `<div class="card"><div class="label">${esc(label)}</div><div class="value">${esc(count)}</div>${breakdownHtml}</div>`;
  }
  html += `</div>`;

  html += `<h2>Recent activity (last ${events.length})</h2>`;
  if (!events.length) {
    html += `<div class="tablewrap"><div class="empty">No events recorded yet.</div></div>`;
  } else {
    html += `<div class="tablewrap"><table>
      <tr><th>Time</th><th>Event</th><th>Detail</th><th>City</th><th>Region</th><th>Country</th><th>Browser</th><th>OS</th><th>Device</th></tr>
      ${events.map(e => `<tr>
        <td>${esc(fmtTime(e.time))}</td>
        <td><span class="pill">${esc(EVENT_LABELS[e.event] || e.event)}</span></td>
        <td>${e.detail ? esc(Object.values(e.detail).join(', ')) : '—'}</td>
        <td>${esc(e.city) || '—'}</td>
        <td>${esc(e.region) || '—'}</td>
        <td>${esc(e.country) || '—'}</td>
        <td>${esc(e.browser) || '—'}</td>
        <td>${esc(e.os) || '—'}</td>
        <td>${esc(e.deviceType) || '—'}</td>
      </tr>`).join('')}
    </table></div>`;
  }

  results.innerHTML = html;
}
</script>
<div class="footer">Private dashboard · not indexed · data stored only in your own Netlify project</div>
</body>
</html>
